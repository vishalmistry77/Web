<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inheritance Demo</title>
    <link rel="stylesheet" href="inheritance_style.css" />
  </head>
  <body>
    
      <h1>Main Heading</h1>
      <div>
        <h2>Heading 1</h2>
        <form>
          <label>username: </label>
          <input type="text" placeholder="username" />
          <label>password: </label>
          <input type="password" placeholder="password" />
          <button>Login</button>
        </form>
        <hr />
      </div>

      <div>
        <h2>Heading 2</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt
          inventore saepe, reiciendis dolorem illo culpa velit odio pariatur,
          officia ad veniam itaque adipisci veritatis quos tenetur. Ut autem
          dolores mollitia!
        </p>
        <hr />
      </div>
      <!--name attribute-->
      <form action="https://www.youtube.com/results">
        <input type="text" placeholder="Search on YouTube" name="search_query">
        <button type="submit">Search</button>
      </form>
      <!--checkbox-->
      <label for="age">18+</label>
      <input type="checkbox" name="age" id="age" checked>
      <!--radio btn-->
      <br>
      <input type="radio" name="fruit" id="apple" value="apple">
      <label for="apple">Apple</label>
      <br>
      <input type="radio" name="fruit" id="mango" value="mango">
      <label for="mango">Mango</label>
      <br>
      <input type="radio" name="fruit" id="banana" value="banana">
      <label for="banana">Banana</label>
      <!--select element-->
      <br>
      <label for="profession">select</label>
      <select name="profession" id="profession">
        <option value="dev">Devloper</option>
        <option value="stud">Student</option>
      </select>
      <!--range-->
      <label for="volume">volume</label>
      <input type="range" min="0" max="100" name="volume" step="10">

      <!--text area-->
      <label for="feedback">Feedback</label>
      <textarea id="feedback" name="feedback" rows="5" cols="10" placeholder="enter feedback"></textarea>
    </body>
</html>
